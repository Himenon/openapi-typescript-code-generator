openapi: 3.1.0
info:
  version: 1.0.0
  title: path-parameter
  description: Test schema for path parameters without explicit required field

servers:
  - url: "https://api.example.com/"

paths:
  /items/{id}:
    get:
      operationId: getItemById
      summary: required フィールドを省略したパスパラメータ
      parameters:
        - in: path
          name: id
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string

  # Kubernetes の /api/v1/nodes/{name}/proxy/{path} に相当するパターン:
  # - パスパラメータを PathItem レベルで定義 (required を省略)
  # - パスパラメータと同名のクエリパラメータ (path) を持つ
  # - GET / HEAD の両オペレーションが PathItem パラメータを継承 (operation レベルに parameters を持たない)
  /nodes/{name}/proxy/{path}:
    parameters:
      - in: path
        name: name
        schema:
          type: string
      - in: path
        name: path
        schema:
          type: string
      - in: query
        name: path
        schema:
          type: string
    get:
      operationId: getNodeProxyWithPath
      summary: PathItem レベルのパスパラメータ継承 (GET)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
    head:
      operationId: headNodeProxyWithPath
      summary: PathItem レベルのパスパラメータ継承 (HEAD)
      responses:
        "200":
          description: OK

  /users/{userId}/posts/{postId}:
    get:
      operationId: getUserPost
      summary: 複数のパスパラメータで required を省略したケース
      parameters:
        - in: path
          name: userId
          schema:
            type: string
        - in: path
          name: postId
          schema:
            type: integer
        - in: query
          name: include
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  postId:
                    type: integer
